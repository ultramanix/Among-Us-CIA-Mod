name: Build CIA Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore
        run: dotnet restore CIA-Mod.csproj

      - name: Build
        run: dotnet build CIA-Mod.csproj --configuration Release --no-restore

      - name: Upload CIA DLL
        uses: actions/upload-artifact@v4
        with:
          name: CIA-Mod
          path: |
            bin/Release/net6.0/CIA-Mod.dll
            bin/Release/net6.0/CIA-Mod.pdb
          if-no-files-found: error
